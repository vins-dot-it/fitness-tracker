<!DOCTYPE html>
<html lang="it" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker V2</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html { font-size: 20px; } /* Carattere aumentato del 25% */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="h-full flex flex-col text-gray-800">

    <header class="bg-white border-b border-gray-200 py-4 px-6 sticky top-0 z-10 shadow-xs">
        <h1 class="text-2xl font-bold text-center text-emerald-600">Fitness Tracker V2</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-24 max-w-xl mx-auto w-full">
        
        <!-- Tab 1: OGGI -->
        <section id="tab-oggi" class="tab-content active space-y-4">
            <div class="flex items-center justify-between bg-white p-4 rounded-xl border border-gray-200 shadow-xs">
                <button id="prev-day" class="p-2 font-bold text-emerald-600 hover:bg-gray-100 rounded-lg text-xl">&larr;</button>
                <h2 id="current-day-title" class="text-xl font-bold capitalize text-gray-900">Lunedì</h2>
                <button id="next-day" class="p-2 font-bold text-emerald-600 hover:bg-gray-100 rounded-lg text-xl">&rarr;</button>
            </div>
            
            <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center shadow-xs">
                <p class="text-sm font-medium text-emerald-800 uppercase tracking-wider">Kcal Totali Giornaliere</p>
                <p id="oggi-total-kcal" class="text-4xl font-extrabold text-emerald-700 mt-1">0</p>
                <p id="oggi-day-type" class="text-xs font-bold text-emerald-600 mt-1 uppercase tracking-wide"></p>
            </div>
            <div id="oggi-meals-container" class="space-y-3"></div>
        </section>

        <!-- Tab 2: STRUTTURA -->
        <section id="tab-struttura" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-xs space-y-3">
                <h2 class="text-xl font-bold text-gray-900">Pianificazione Settimanale</h2>
                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button id="btn-plan-3" class="bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg shadow-xs">3 Allenamenti</button>
                    <button id="btn-plan-4" class="bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg shadow-xs">4 Allenamenti</button>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-xs space-y-3">
                <h3 class="text-lg font-bold text-gray-900 border-b border-gray-100 pb-2">Modifica Giorni (ON/OFF)</h3>
                <div id="struttura-giorni-container" class="space-y-2"></div>
                <button id="save-struttura" class="w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg shadow-xs mt-4">Salva Struttura</button>
            </div>
        </section>

        <!-- Tab 3: SCEGLI PASTI -->
        <section id="tab-pasti" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-xs">
                <h2 class="text-xl font-bold text-gray-900 mb-1">Seleziona Varianti</h2>
                <div id="scegli-pasti-container" class="space-y-4"></div>
            </div>
        </section>

        <!-- Tab 4: PESO -->
        <section id="tab-peso" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-xs space-y-3">
                <h2 class="text-xl font-bold text-gray-900">Gestione Avanzata Peso</h2>
                <form id="peso-form" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Data</label>
                            <input type="date" id="peso-date" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 font-medium" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Peso (kg)</label>
                            <input type="number" step="0.1" id="peso-val" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 font-medium" required>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg shadow-xs">Registra Peso</button>
                </form>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-xs text-center">
                    <p class="text-xs font-bold text-gray-500 uppercase">Media 7 Giorni</p>
                    <p id="peso-media" class="text-2xl font-extrabold text-gray-900 mt-1">--</p>
                </div>
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-xs text-center">
                    <p class="text-xs font-bold text-gray-500 uppercase">Target</p>
                    <p class="text-2xl font-extrabold text-emerald-600 mt-1">72.0 kg</p>
                </div>
            </div>
            <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center shadow-xs">
                <p class="text-xs font-bold text-emerald-800 uppercase">Previsione Raggiungimento Target</p>
                <p id="peso-previsione" class="text-base font-bold text-emerald-700 mt-1">Inserisci più dati...</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-xs">
                <canvas id="weightChart" class="w-full h-48"></canvas>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-xs">
                <h3 class="text-sm font-bold text-gray-900 mb-2 border-b border-gray-100 pb-1">Storico Record</h3>
                <div id="peso-log" class="max-h-40 overflow-y-auto divide-y divide-gray-100 text-sm"></div>
            </div>
        </section>

    </main>

    <nav class="bg-white border-t border-gray-200 fixed bottom-0 left-0 right-0 z-20 shadow-lg">
        <div class="max-w-xl mx-auto flex justify-around">
            <button data-target="tab-oggi" class="nav-btn flex-1 py-3 text-center text-emerald-600 font-bold border-t-2 border-emerald-600 text-sm">Oggi</button>
            <button data-target="tab-struttura" class="nav-btn flex-1 py-3 text-center text-gray-500 font-medium text-sm">Struttura</button>
            <button data-target="tab-pasti" class="nav-btn flex-1 py-3 text-center text-gray-500 font-medium text-sm">Scegli Pasti</button>
            <button data-target="tab-peso" class="nav-btn flex-1 py-3 text-center text-gray-500 font-medium text-sm">Peso</button>
        </div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
