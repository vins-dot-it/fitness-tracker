<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#059669"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Fitness Tracker</title><style>body{font-family:system-ui;margin:0;background:#f8fafc;color:#0f172a}*{box-sizing:border-box}.wrap{max-width:900px;margin:auto;padding:18px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:700;background:white}.nav button.active,.btn{background:#0f172a;color:white}.card{background:white;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 3px 15px #0000000c}.grid{display:grid;gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}.hero{background:#059669;color:white}.dark{background:#0f172a;color:white}.blue{background:#2563eb;color:white}.meal{background:#f8fafc;padding:14px;border-radius:15px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:12px}.muted{color:#64748b;font-size:14px}input{padding:12px;border:1px solid #cbd5e1;border-radius:14px;font-size:16px;width:100%}canvas{width:100%;height:240px}.pill{background:#d1fae5;color:#047857;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}</style></head><body><div id="app"></div><script src="app.js"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
